<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
<title id="title">JOP: a second look before checkout</title>
<desc id="desc">Google Takeout provides a local MBOX. A Python importer produces a full DuckDB archive and shopping SQLite. A second Python step reconstructs orders and returns into the app SQLite database. The browser uses a local Node server. A human decides whether to buy.</desc>
